name: QA Validation

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://qa:qa@127.0.0.1:5432/marvedge_qa
  NEXTAUTH_SECRET: ci-only-qa-secret
  NEXTAUTH_URL: http://127.0.0.1:3100
  CI: true

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Check QA source formatting
        run: npx prettier --check "docs/qa/*.md" "e2e/*.spec.ts" "vitest.config.ts"

      - name: Lint QA source
        run: npx eslint -- "e2e/*.spec.ts" vitest.config.ts

      - name: Check whitespace
        run: git diff --check

  unit-tests:
    name: Unit and worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up FFmpeg and FFprobe
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ffmpeg_path="$(node -p "require('ffmpeg-static')")"
          ffprobe_path="$(node -p "require('ffprobe-static').path")"
          test -x "$ffmpeg_path"
          test -x "$ffprobe_path"
          media_bin="$RUNNER_TEMP/marvedge-media-bin"
          mkdir -p "$media_bin"
          ln -sf "$ffmpeg_path" "$media_bin/ffmpeg"
          ln -sf "$ffprobe_path" "$media_bin/ffprobe"
          echo "$media_bin" >> "$GITHUB_PATH"
          "$media_bin/ffmpeg" -version
          "$media_bin/ffprobe" -version

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run Vitest suites
        run: npm test

      - name: Run standalone AVS pacing tests
        if: always()
        run: npm run test:avs

  browser-tests:
    name: Chromium E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright regression suite
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
